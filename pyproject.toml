[project]
name = "tiktok-pipeline"
version = "0.1.0"
description = "Generate TikTok-ready 9:16 images with AI, upload them to ImageKit CDN, and publish each post to HiveMQ."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "requests>=2.31",
    "paho-mqtt>=2.0",
    "pytrends>=4.9.2",
]

[project.scripts]
tiktok-pipeline = "tiktok_pipeline:_cli"
tiktok-generate = "tiktok_image_generator:_cli"
tiktok-publish = "tiktok_publish:_cli"
tiktok-idea = "idea_generator:_cli"
tiktok-content = "content_generator:_cli"
tiktok-comment = "comment_on_post:_cli"
tiktok-comment-gen = "comment_generator:_cli"
tiktok-profile = "profile_loader:_cli"
imagekit-upload = "imagekit_uploader:_cli"
hivemq-publish = "hivemq_publisher:_cli"
trending-recommender = "trending_recommender:_cli"
trending-workflow = "trending_workflow:_cli"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "tiktok_pipeline.py",
    "tiktok_image_generator.py",
    "tiktok_publish.py",
    "idea_generator.py",
    "content_generator.py",
    "comment_on_post.py",
    "comment_generator.py",
    "profile_loader.py",
    "imagekit_uploader.py",
    "hivemq_publisher.py",
    "env_loader.py",
    "trending_recommender.py",
    "trending_workflow.py",
]
