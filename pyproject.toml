[project]
name = "tiktok-pipeline"
version = "0.1.0"
description = "Generate TikTok-ready 9:16 images with AI, upload them to ImageKit CDN, and record each post in Airtable."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "requests>=2.31",
]

[project.scripts]
tiktok-pipeline = "tiktok_pipeline:_cli"
tiktok-generate = "tiktok_image_generator:_cli"
tiktok-publish = "tiktok_publish:_cli"
tiktok-idea = "idea_generator:_cli"
tiktok-caption = "caption_generator:_cli"
tiktok-profile = "profile_loader:_cli"
imagekit-upload = "imagekit_uploader:_cli"
airtable-log = "airtable_logger:_cli"
airtable-migrate = "airtable_migrate:_cli"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "tiktok_pipeline.py",
    "tiktok_image_generator.py",
    "tiktok_publish.py",
    "idea_generator.py",
    "caption_generator.py",
    "profile_loader.py",
    "imagekit_uploader.py",
    "airtable_logger.py",
    "airtable_migrate.py",
    "env_loader.py",
]
